# Rate-limit zones for farhad.bio.
# Installed to /etc/nginx/conf.d/farhadbio-zones.conf, which nginx includes
# inside the http{} block — so this project never has to edit the shared
# /etc/nginx/nginx.conf that another project also depends on.
#
# Separate zones (rather than reusing promall_*) keep a traffic spike on one
# site from throttling the other.

# Normal API reads. 10r/s is far above real traffic; this is an abuse ceiling.
limit_req_zone $binary_remote_addr zone=farhadbio_general:10m rate=10r/s;

# Login attempts. Deliberately brutal — the backend also enforces 10/15min.
limit_req_zone $binary_remote_addr zone=farhadbio_auth:5m rate=2r/s;

# Pageview beacons. One per navigation, so a fast reader can legitimately
# generate several per second.
limit_req_zone $binary_remote_addr zone=farhadbio_events:10m rate=20r/s;
