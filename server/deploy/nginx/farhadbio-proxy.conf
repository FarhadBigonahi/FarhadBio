# Shared proxy_pass settings for api.farhad.bio.
# Installed to /etc/nginx/snippets/farhadbio-proxy.conf.
#
# Kept in one snippet so the three location blocks cannot drift apart — a
# missing X-Forwarded-For in one of them would silently break rate limiting
# and analytics geo/IP handling for exactly that route.

proxy_pass http://127.0.0.1:3010;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Cloudflare's country header — the analytics ingest reads it instead of
# shipping a GeoIP database.
proxy_set_header CF-IPCountry      $http_cf_ipcountry;

proxy_connect_timeout 10s;
proxy_read_timeout    30s;
proxy_send_timeout    30s;
