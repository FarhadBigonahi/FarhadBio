# Reverse proxy for farhadbio-api (Fastify) on 127.0.0.1:3010.
# Installed to /etc/nginx/sites-available/ and symlinked into sites-enabled
# by provision.sh.
#
# TLS: farhad.bio's DNS is on Cloudflare and this record is proxied (orange
# cloud), so the certificate below only ever has to satisfy Cloudflare.
#
# It is currently a Let's Encrypt certificate obtained by DNS-01 from a
# non-Iran host (the Cloudflare API is geo-blocked from THIS server's IP, and
# HTTP-01 cannot work while the record is proxied). A Cloudflare Origin CA
# certificate is the better long-term answer — 15 years, no renewal — and can
# be dropped in at the same paths. See README.md.

server {
    listen 80;
    listen [::]:80;
    server_name api.farhad.bio;

    # Everything public is HTTPS. Kept as a redirect (not a hard close) so a
    # mistyped http:// call still lands somewhere sensible.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.farhad.bio;

    ssl_certificate     /etc/ssl/farhadbio/api.crt;
    ssl_certificate_key /etc/ssl/farhadbio/api.key;

    include snippets/security-headers.conf;

    # A blog post with inline HTML. Nothing here uploads files.
    client_max_body_size 2m;

    access_log /var/log/nginx/farhadbio-api.access.log;
    error_log  /var/log/nginx/farhadbio-api.error.log;

    # Health checks are noise in the access log and must never be rate limited.
    location /health/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        access_log off;
    }

    # Login is the only guessable endpoint — throttle it hardest.
    location = /v1/auth/login {
        limit_req zone=farhadbio_auth burst=5 nodelay;
        include snippets/farhadbio-proxy.conf;
    }

    # The analytics beacon is high-volume by design: every pageview hits it.
    location = /v1/events {
        limit_req zone=farhadbio_events burst=40 nodelay;
        include snippets/farhadbio-proxy.conf;
    }

    location / {
        limit_req zone=farhadbio_general burst=20 nodelay;
        include snippets/farhadbio-proxy.conf;
    }
}
